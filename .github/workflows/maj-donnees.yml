# Met à jour chaque mois les données embarquées (Orphanet, HGNC, HPO, ClinGen, CPIC, médicaments français),
# les vérifie par les tests, et propose le changement dans une demande de fusion à relire.
# La base des médicaments demande des données à jour ; Orphanet publie deux fois par an.
name: Mise à jour des données

on:
  schedule:
    - cron: '17 5 2 * *'   # le 2 de chaque mois, 5 h 17 (UTC)
  workflow_dispatch:
    inputs:
      ouvrir_pr:
        description: "Ouvrir une demande de fusion si les données ont changé (sinon, simple essai)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Une source en échec (serveur indisponible) garde son ancien fichier et n'arrête pas les autres ;
      # l'étape finale le signale pour que vous receviez un mail d'échec.
      - name: Régénérer les données
        id: data
        continue-on-error: true
        run: npm run data
      - name: Vérifier les données
        run: npm test
      - name: Ne garder que ce qui a vraiment changé
        id: diff
        run: |
          changes=$(node tools/data_diff.mjs)
          node tools/data_diff.mjs --restore > /dev/null
          if [ -z "$changes" ]; then
            echo "Rien de nouveau dans les bases : les données sont à jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Fichiers changés :"; echo "$changes"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ouvrir la demande de fusion
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.ouvrir_pr)
        env:
          GH_TOKEN: ${{ github.token }}
          DONNEES: ${{ steps.data.outcome }}
        run: |
          avertissement=""
          if [ "$DONNEES" != "success" ]; then
            avertissement="**Attention : au moins une source n'a pas pu être mise à jour** (son ancien fichier est gardé). Voir l'étape « Régénérer les données » de l'exécution.

          "
          fi
          branche="maj-donnees-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branche"
          nouveau_cache=$(node tools/bump_cache.mjs)
          git add -A
          git commit -m "Mise à jour des données ($(date -u +%F))"
          git push origin "$branche"
          if ! gh pr create --base main --head "$branche" \
            --title "Mise à jour des données ($(date -u +%F))" \
            --body "${avertissement}Données regénérées automatiquement depuis les bases publiques (les tests sont passés). Cache du service worker : \`$nouveau_cache\`.

          À relire avant de fusionner : la publication suit toute seule à la fusion. Pensez à passer la version (numéro et CHANGELOG) si le changement est notable."; then
            echo "::error::Les données à jour sont sur la branche $branche, mais la demande de fusion n'a pas pu s'ouvrir. Autorisez-la une fois pour toutes dans Settings > Actions > General > « Allow GitHub Actions to create and approve pull requests », ou ouvrez-la à la main : https://github.com/${GITHUB_REPOSITORY}/compare/${branche}?expand=1"
            exit 1
          fi
      - name: Signaler une source en échec
        if: steps.data.outcome == 'failure'
        run: |
          echo "::error::Au moins une source n'a pas pu être mise à jour (voir l'étape « Régénérer les données »)."
          exit 1
